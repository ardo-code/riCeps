<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#111114">
<style>
:root{--bg:#f2f2f5;--fg:#1c1c1e;--card:#fff;--line:#d6d6dc;--mut:#6e6e76;--acc:#0a84ff;--ok:#30a14e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--fg:#f2f2f5;--card:#222227;--line:#38383f;--mut:#9a9aa3}}
:root[data-theme="dark"]{--bg:#111114;--fg:#f2f2f5;--card:#222227;--line:#38383f;--mut:#9a9aa3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px inherit;font-family:inherit;padding:12px 2px}
nav button.on{background:var(--acc);color:#fff;font-weight:800}
h2{margin:4px 0 10px;font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd b{font-size:16px}
.mut{color:var(--mut);font-size:13px}
.up{background:var(--ok);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.set{display:flex;align-items:center;gap:6px;margin-top:8px}
.n{width:16px;color:var(--mut);font-size:13px}
.st{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.st button{width:30px;height:38px;border:0;background:var(--bg);color:var(--fg);font-size:20px}
.st span{min-width:44px;text-align:center;font-weight:600;font-size:14px}
.st.r span{min-width:30px}
.dn{width:42px;height:40px;margin-left:auto;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:20px}
.dn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 16px inherit;font-family:inherit;margin-bottom:8px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.warn{background:#ff9f0a;color:#000;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}
input[type=number]{width:100px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .btn{margin:0;width:auto;padding:10px 16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:340px}
.box p{margin:8px 0 12px}
.box input{width:100%;margin:10px 0 12px}
.box .row .btn{flex:1}
.un{height:38px;width:54px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:600 14px inherit;font-family:inherit;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;padding:0}
.btn.dis{opacity:.45}
.btn.big{font-size:19px;padding:16px}
.btn.soft{background:var(--line);border-color:var(--line)}
.btn.red{color:#e5322b}
.btn.acc{color:var(--acc);font-weight:700}
.flair{display:block;width:70%;max-width:280px;margin:18px auto 8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flair{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}}
:root[data-theme="dark"] .flair{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
#sheet{position:fixed;inset:0;background:var(--bg);color:var(--fg);overflow-y:auto;z-index:8;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;padding:10px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:600 14px inherit;font-family:inherit}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ic{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px;margin-left:4px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fl label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.fl input{width:62px}
.fl select,.srch{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px;padding:0 8px}
.srch{width:100%;margin-bottom:8px}
.gh{margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase}
.pk{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:12px;margin-bottom:4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:16px inherit;font-family:inherit}
.pk:disabled{opacity:.45}
.add{background:none;border:1px dashed var(--line);border-radius:10px;color:var(--mut);padding:8px;width:100%;margin-top:8px;font:600 14px inherit;font-family:inherit}
</style>
</head>
<body>
<div id="app"><main id="main"></main><nav id="nav"></nav></div>
<input type="file" id="file" accept=".json,application/json" hidden>

  let h='<div class="hd"><h2>'+(std?'My standard workouts':'Today: '+esc(cfg.days[sh.di].name))+'</h2><button class="btn p" style="width:auto;margin:0;padding:10px 18px" data-a="sh-close">Done</button></div>';
  if(sh.pick){
    h+='<button class="btn" data-a="sh-back">‹ Back</button><input class="srch" id="q" type="search" placeholder="Search exercises"><div id="pl"></div><div class="card"><b>Create your own</b><input class="srch" id="cn" placeholder="Exercise name" style="margin-top:8px"><select class="srch" id="cm">'+mOpts('kg')+'</select><button class="btn p" data-a="sh-new">Create and add</button></div>';
    el.innerHTML=h;$('#q').oninput=plist;plist();el.scrollTop=st;return;
  }
  h+=std?'<div class="seg">'+cfg.days.map((x,i)=>'<button data-a="sh-day" data-di="'+i+'" class="'+(i===sh.di?'on':'')+'">'+esc(x.short||x.name)+'</button>').join('')+'</div>':'<div class="mut" style="margin-bottom:8px">Changes here apply to this workout only.</div>';
  if(!l.length)h+='<div class="mut" style="margin:10px 0">No exercises yet.</div>';
  l.forEach((e,i)=>{
    const rm='<button class="ic" data-a="sh-rm" data-x="'+i+'">✕</button>';
    if(!std){h+='<div class="card"><div class="hd"><b>'+esc(e.name)+'</b>'+rm+'</div><div class="mut">Target '+target(e)+'</div></div>';return}
    h+='<div class="card"><div class="hd"><b>'+esc(e.name)+'</b><span><button class="ic" data-a="sh-up" data-x="'+i+'">↑</button><button class="ic" data-a="sh-dn" data-x="'+i+'">↓</button>'+rm+'</span></div><div class="fl">'+fld('Sets','sets',e.sets,i)+fld(e.type==='timed'?'Min s':'Min','min',e.reps[0],i)+fld(e.type==='timed'?'Max s':'Max','max',e.reps[1],i)+(e.type==='timed'?'':fld('Start','start',e.start||0,i))+'<label>Measure<select data-f="m" data-x="'+i+'">'+mOpts(mk(e))+'</select></label></div></div>';
  });
  h+='<button class="btn p" data-a="sh-add">+ Add exercise</button>';
  el.innerHTML=h;el.scrollTop=st;
}
function addEx(src){
  const l=shList();if(l.some(z=>z.name===src.name))return;
  const e={name:src.name,type:src.type,step:src.step,sets:src.sets,reps:[...src.reps],start:src.start};
  if(src.unit)e.unit=src.unit;
  l.push(e);
  if(sh.k==='ses')draft[sh.di].rows[e.name]=mkRows(e,cfg.days[sh.di].name);
  sh.pick=false;save();drawSheet();$('#sheet').scrollTop=0;
}
function sheetField(e){
  const f=e.target.closest('[data-f]');if(!f||!sh)return false;
  const ex=shList()[+f.dataset.x],v=parseFloat(f.value),k=f.dataset.f;
  if(k==='m'){Object.assign(ex,MT[f.value]);ex.step=/lvl/.test(f.value)?1:2.5}
  else if(v>=0){
    if(k==='sets')ex.sets=Math.max(1,Math.round(v));
    else if(k==='min'){ex.reps[0]=Math.round(v);if(ex.reps[1]<ex.reps[0])ex.reps[1]=ex.reps[0]}
    else if(k==='max'){ex.reps[1]=Math.round(v);if(ex.reps[0]>ex.reps[1])ex.reps[0]=ex.reps[1]}
    else if(k==='start')ex.start=v;
  }
  save();drawSheet();return true;
}
async function sheetAct(a,b){
  const x=+b.dataset.x;
  if(a==='sh-std')openSheet('std',0);
  else if(a==='sh-ses')openSheet('ses',tab);
  else if(a==='sh-close')closeSheet();
  else if(a==='sh-day'){sh.di=+b.dataset.di;drawSheet()}
  else if(a==='sh-add'||a==='sh-back'){sh.pick=a==='sh-add';drawSheet();$('#sheet').scrollTop=0}
  else if(a==='sh-up'||a==='sh-dn'){const l=shList(),j=a==='sh-up'?x-1:x+1;if(j>=0&&j<l.length){[l[x],l[j]]=[l[j],l[x]];save();drawSheet()}}
  else if(a==='sh-rm'){
    const l=shList(),e=l[x];
    if(sh.k==='ses'){
      const rs=draft[sh.di].rows[e.name]||[];
      if(rs.some(r=>r.d)&&!await ask('Remove '+esc(e.name)+'?',{body:'Its ticked sets in this workout will be discarded.',ok:'Remove'}))return;
      delete draft[sh.di].rows[e.name];
    }
    l.splice(x,1);save();drawSheet();
  }
  else if(a==='sh-pick')addEx(allLib()[x]);
  else if(a==='sh-new'){
    const n=$('#cn').value.trim();if(!n)return;
    const m=$('#cm').value,e={name:n,...MT[m],step:/lvl/.test(m)?1:2.5,sets:3,reps:m==='time'?[30,60]:[8,12],start:0,group:'Custom'};
    if(!allLib().some(z=>z.name.toLowerCase()===n.toLowerCase()))custom.push(e);
    addEx(e);
  }
}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=ld('wt_cfg',DEF),custom=ld('wt_custom',[]),sess=ld('wt_sess',[]),bw=ld('wt_bw',[]),draft=ld('wt_draft',{}),meta=ld('wt_meta',{}),tab=0;
const save=()=>{sv('wt_cfg',cfg);sv('wt_custom',custom);sv('wt_sess',sess);sv('wt_bw',bw);sv('wt_draft',draft);sv('wt_meta',meta)};
const rnd=x=>Math.round(x*100)/100;
const defM=e=>e.type==='timed'?'time':e.type==='bodyweight'?'bw':e.unit==='level'?'lvl':'kg';
const mOf=(e,x)=>x.m||defM(e);
function fv(e,v,m){m=m||defM(e);return m==='bw'?(v?'BW +'+v+' kg':'BW'):m==='lvl'?'Lvl '+v:m==='time'?v+' s':v+' kg'}
function ask(title,o){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='ov';
    el.innerHTML='<div class="box"><b>'+title+'</b>'+(o.body?'<p class="mut">'+o.body+'</p>':'')+(o.input!==undefined?'<input type="number" inputmode="decimal" step="any" value="'+o.input+'">':'')+'<div class="row"><button class="btn'+(o.danger?' acc':'')+'" data-n>'+(o.cancel||'Cancel')+'</button><button class="btn'+(o.danger?' red':' p')+'" data-y>'+(o.ok||'OK')+'</button></div></div>';
    document.body.appendChild(el);
    const i=el.querySelector('input');if(i){i.focus();i.select()}
    const done=v=>{el.remove();res(v)};
    el.querySelector('[data-n]').onclick=()=>done(null);
    el.querySelector('[data-y]').onclick=()=>done(i?i.value:true);
  });
}
function lastSets(day,ex){
  for(let i=sess.length-1;i>=0;i--){
    if(sess[i].day!==day)continue;
    const s=sess[i].sets.filter(x=>x.ex===ex);
    if(s.length)return s;
  }
  return null;
}
function ready(e,day){
  const ls=lastSets(day,e.name);
  return !!ls&&ls.length>=e.sets&&ls.filter(x=>x.reps>=e.reps[1]).length>=e.sets;
}
function target(e){return e.sets+' × '+(e.reps[0]===e.reps[1]?e.reps[1]:e.reps[0]+'–'+e.reps[1])+(e.type==='timed'?' s':'')}
function startDay(i){
  const d=cfg.days[i],rows={};
  d.exercises.forEach(e=>{
    const ls=lastSets(d.name,e.name);
    rows[e.name]=Array.from({length:e.sets},(_,k)=>{
      const p=ls&&(ls[k]||ls[ls.length-1]);
      return{v:p?p.value:(e.start||0),r:p?p.reps:e.reps[0],d:false,m:p?mOf(e,p):defM(e)};
    });
  });
  draft[i]={date:new Date().toISOString(),rows,exs:JSON.parse(JSON.stringify(d.exercises))};save();render();
}
function resumeDay(i){
  const d=cfg.days[i],prev=[...sess].reverse().find(s=>s.day===d.name);if(!prev)return;
  const rows={};
  const xl=JSON.parse(JSON.stringify(prev.exs||d.exercises));
  xl.forEach(e=>{
    const got=prev.sets.filter(x=>x.ex===e.name).map(x=>({v:x.value,r:x.reps,d:true,m:mOf(e,x)}));
    if(got.length){while(got.length<e.sets)got.push({...got[got.length-1],d:false});rows[e.name]=got}
    else{const ls=lastSets(d.name,e.name);rows[e.name]=Array.from({length:e.sets},(_,k)=>{const p=ls&&(ls[k]||ls[ls.length-1]);return{v:p?p.value:(e.start||0),r:p?p.reps:e.reps[0],d:false,m:p?mOf(e,p):defM(e)}})}
  });
  draft[i]={date:prev.date,rows,exs:xl,editId:prev.id};save();render();
}
function dayView(i){
  const dr=draft[i],d={...cfg.days[i],exercises:exs(i)};
  let h='<h2>'+esc(d.name)+'</h2>'+(dr&&dr.editId?'<div class="mut" style="margin:-6px 0 8px">Editing a saved workout. Finish updates it.</div>':'');
  d.exercises.forEach((e,xi)=>{
    const up=ready(e,d.name),ls=lastSets(d.name,e.name);
    h+='<div class="card"><div class="hd"><b>'+esc(e.name)+'</b>'+(up?'<span class="up">'+(e.type==='assisted'?'⬇ Ready: less assist':'⬆ Ready to go up')+'</span>':'')+'</div>';
    h+='<div class="mut">Target '+target(e)+(e.type==='assisted'?' · assisted: lower is stronger':'')+'</div>';
    if(!dr){
      const tm=ls&&mOf(e,ls[0])==='time';h+='<div class="mut">'+(ls?'Last: '+(tm?'':fv(e,ls[0].value,mOf(e,ls[0]))+' × ')+ls.map(x=>x.reps).join(', ')+(tm?' s':''):'No history yet')+'</div>';
    }else{
      dr.rows[e.name].forEach((r,k)=>{
        h+='<div class="set"><span class="n">'+(k+1)+'</span>';
        const m=r.m||defM(e),ka='data-x="'+xi+'" data-k="'+k+'"';
        if(m!=='time')h+='<div class="st"><button '+ka+' data-a="v-">−</button><span '+ka+' data-a="vn">'+(m==='bw'?(r.v?'+'+r.v:'BW'):r.v)+'</span><button '+ka+' data-a="v+">+</button></div>';
        h+='<select class="un" '+ka+' data-s="m">'+[['kg','kg'],['lvl','Lvl'],['bw','BW'],['time','Time']].map(o=>'<option value="'+o[0]+'"'+(o[0]===m?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
        h+='<div class="st r"><button '+ka+' data-a="r-">−</button><span '+ka+' data-a="rn">'+r.r+(m==='time'?'s':'')+'</span><button '+ka+' data-a="r+">+</button></div>';
        h+='<button class="dn'+(r.d?' on':'')+'" data-x="'+xi+'" data-k="'+k+'" data-a="d">✓</button></div>';
      });
      h+='<button class="add" data-x="'+xi+'" data-a="addset">+ Set</button>';
    }
    h+='</div>';
  });
  const prev=[...sess].reverse().find(s=>s.day===d.name);
  h+=dr?'<button class="btn big soft" data-a="sh-ses">Customise today’s exercises</button><button class="btn p big" data-a="finish">Finish workout</button><button class="btn big red" data-a="cancel">Discard</button>':(prev?'<button class="btn big soft" data-a="resume">Resume last workout ('+new Date(prev.date).toLocaleDateString('en-AU')+')</button>':'<button class="btn big soft dis" disabled>Resume last workout</button>')+'<button class="btn p big" data-a="start">Start workout</button>';
  return h;
}
function days(a){return(Date.now()-new Date(a))/864e5}
function logView(){
  let h='<h2>History &amp; settings</h2>';
  if(sess.length&&(!meta.lastExport||days(meta.lastExport)>21))h+='<div class="warn">It has been a while since your last export. Tap Back up now to save a copy.</div>';
  h+='<div class="card"><b>Body weight</b><div class="row" style="margin-top:8px"><input type="number" id="bwv" inputmode="decimal" step="0.1" placeholder="kg"><button class="btn p" data-a="addbw">Add</button></div>';
  h+=bw.slice(-5).reverse().map(x=>'<div class="mut">'+new Date(x.date).toLocaleDateString('en-AU')+' — '+x.kg+' kg</div>').join('')||'<div class="mut">No entries yet</div>';
  h+='</div><div class="card"><b>Recent workouts</b>';
  h+=sess.slice(-8).reverse().map(s=>'<div class="mut">'+new Date(s.date).toLocaleDateString('en-AU')+' — '+esc(s.day)+' ('+s.sets.length+' sets)</div>').join('')||'<div class="mut">None yet</div>';
  h+='</div><button class="btn p" data-a="sh-std">Edit my standard workouts</button><button class="btn" data-a="csv">Export sets (CSV)</button><button class="btn" data-a="backup">Back up now (JSON)</button><button class="btn" data-a="restore">Restore backup</button><img class="flair" src="'+MUSCLE+'" alt="">';
  return h;
}
function render(){
  const m=$('#main'),st=m.scrollTop;
  m.innerHTML=tab<cfg.days.length?dayView(tab):logView();
  m.scrollTop=st;
  $('#nav').innerHTML=cfg.days.map((d,i)=>'<button data-t="'+i+'" class="'+(tab===i?'on':'')+'">'+esc(d.short||d.name)+(draft[i]?' •':'')+'</button>').join('')+'<button data-t="'+cfg.days.length+'" class="'+(tab>=cfg.days.length?'on':'')+'">Log</button>';
}
async function out(name,text,type){
  const f=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}catch(e){if(e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();return true;
}
function bwAt(date){let k='';bw.forEach(x=>{if(x.date<=date)k=x.kg});return k}
function csv(){
  const r=[['date','day','exercise','type','unit','set','value','reps_or_seconds','bodyweight_kg']];
  sess.forEach(s=>s.sets.forEach(x=>r.push([s.date.slice(0,10),s.day,x.ex,x.type,x.m||(x.type==='timed'?'time':x.type==='bodyweight'?'bw':x.unit==='level'?'lvl':'kg'),x.set,x.value,x.reps,bwAt(s.date)])));
  return r.map(a=>a.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
}
function readFile(cb){
  const f=$('#file');f.value='';
  f.onchange=()=>{const x=f.files[0];if(!x)return;const rd=new FileReader();rd.onload=()=>{try{cb(JSON.parse(rd.result))}catch(e){ask('Could not read file',{body:'That file could not be read.',ok:'OK',cancel:'Close'})}};rd.readAsText(x)};
  f.click();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-t]');
  if(t){tab=+t.dataset.t;render();$('#main').scrollTop=0;return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d={...cfg.days[tab],exercises:exs(tab)};
  if(a.startsWith('sh-')){sheetAct(a,b);return}
  if(a==='vn'||a==='rn'){
    const ex=d.exercises[+b.dataset.x],r=draft[tab].rows[ex.name][+b.dataset.k],isv=a==='vn';
    const v=await ask(isv?'Enter value':'Enter '+((r.m||defM(ex))==='time'?'seconds':'reps'),{input:isv?r.v:r.r});
    const n=parseFloat(v);
    if(v!==null&&n>=0){if(isv)r.v=rnd(n);else r.r=Math.round(n);save();render()}
    return;
  }
  if(a==='addset'){const rows=draft[tab].rows[d.exercises[+b.dataset.x].name];rows.push({...rows[rows.length-1],d:false});save();render();return}
  if('v-v+r-r+d'.includes(a)&&b.dataset.x!==undefined){
    const ex=d.exercises[+b.dataset.x],r=draft[tab].rows[ex.name][+b.dataset.k];
    if(a==='d')r.d=!r.d;
    else if(a[0]==='v'){const m=r.m||defM(ex),s=m==='lvl'?1:(ex.unit!=='level'&&ex.step)||2.5;r.v=Math.max(0,rnd(r.v+(a[1]==='+'?s:-s)))}
    else{const s=(r.m||defM(ex))==='time'?5:1;r.r=Math.max(0,r.r+(a[1]==='+'?s:-s))}
    save();render();return;
  }
  if(a==='start')startDay(tab);
  else if(a==='resume')resumeDay(tab);
  else if(a==='cancel'){if(await ask('Discard this workout?',{body:'Everything entered in this workout will be cleared.',ok:'Discard',cancel:'Keep going',danger:true})){delete draft[tab];save();render();$('#main').scrollTop=0}}
  else if(a==='finish'){
    const sets=[];let tot=0;
    d.exercises.forEach(ex=>draft[tab].rows[ex.name].forEach((r,k)=>{tot++;if(r.d){const m=r.m||defM(ex);sets.push({ex:ex.name,type:ex.type,unit:ex.unit||'',m,set:k+1,value:m==='time'?0:r.v,reps:r.r})}}));
    if(!sets.length){await ask('Nothing to save yet',{body:'Tick at least one set as done first.',ok:'OK',cancel:'Close'});return}
    if(sets.length<tot&&!await ask('Have you really finished?',{body:sets.length+' of '+tot+' sets are ticked. Unticked sets will not be saved.',ok:'Finish anyway',cancel:'Go back'}))return;
    const dd=draft[tab],ix=dd.editId?sess.findIndex(s=>s.id===dd.editId):-1;
    if(ix>=0)sess[ix]={...sess[ix],sets,exs:d.exercises};else sess.push({id:Date.now(),date:dd.date,day:d.name,sets,exs:d.exercises});
    delete draft[tab];save();render();$('#main').scrollTop=0;
  }
  else if(a==='addbw'){const v=parseFloat($('#bwv').value);if(v>0){bw.push({date:new Date().toISOString(),kg:v});save();render()}}
  else if(a==='csv'){if(await out('workouts.csv',csv(),'text/csv')){meta.lastExport=new Date().toISOString();save();render()}}
  else if(a==='backup'){if(await out('workout-backup.json',JSON.stringify({cfg,sess,bw,custom}),'application/json')){meta.lastExport=new Date().toISOString();save();render()}}
  else if(a==='restore')readFile(async o=>{if(o.sess&&o.cfg&&await ask('Replace all data?',{body:'This replaces all current data with the backup.',ok:'Replace',danger:true})){cfg=o.cfg;sess=o.sess;bw=o.bw||[];custom=o.custom||[];draft={};save();render()}});
  else if(a==='impcfg')readFile(o=>{const c=o.days?o:o.cfg;if(c&&Array.isArray(c.days)&&c.days.length){cfg=c;draft={};tab=0;save();render()}else alert('No days found in that file.')});
  else if(a==='expcfg')out('workout-config.json',JSON.stringify(cfg,null,1),'application/json');
  else if(a==='defcfg'){if(confirm('Replace your config with the sample? History is kept.')){cfg=DEF;draft={};tab=0;save();render()}}
});
document.addEventListener('change',e=>{
  if(sheetField(e))return;
  const s=e.target.closest('[data-s]');if(!s)return;
  const ex=exs(tab)[+s.dataset.x],r=draft[tab].rows[ex.name][+s.dataset.k],was=(r.m||defM(ex))==='time';
  r.m=s.value;r.v=0;
  const now=r.m==='time';
  if(was!==now)r.r=now?30:(ex.type==='timed'?10:ex.reps[0]);
  save();render();
});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
